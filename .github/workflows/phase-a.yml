name: Phase A foundation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18.4
        env:
          POSTGRES_USER: fz_ci
          POSTGRES_PASSWORD: ci-ephemeral-only
          POSTGRES_DB: formation_zero_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U fz_ci -d formation_zero_test"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      EXPO_NO_TELEMETRY: "1"
      TEST_DATABASE_URL: postgresql://fz_ci:${{ 'ci-ephemeral-only' }}@localhost:5432/formation_zero_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22.23.2"
          cache: npm
      - run: npm ci --no-fund
      - name: Validate Phase A, Amendment 001, Phase B, B2, C, D, E and F (all migrations, corpus, rules, prescriptions, validation and execution)
        run: npm run validate
      - run: npm run ci:failure-probes
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: phase-a-evidence
          path: |
            docs/DEPENDENCY_LICENSES.json
            docs/THIRD_PARTY_NOTICES.txt
            validation-artifacts/
